# Builds the legacy VB.NET Web Forms app on a Windows machine, runs it on SQLite,
# checks it, records the golden master results and takes the demo screenshots.
# If Azure is set up (see docs/azure-setup.md), it then deploys the app to Azure
# App Service and checks the live address.
name: Legacy app

on:
  push:
    paths:
      - 'legacy/**'
      - 'db/**'
      - 'tools/legacy-check/**'
      - 'golden/**'
      - 'tools/*.mjs'
      - '.github/workflows/legacy.yml'
  workflow_dispatch:

jobs:
  legacy:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      SQLITE_VERSION: '1.0.119'
      SQLITE_SHA256: 'f5f86b80729323890da590a8c7ba7957f04e2735e583d075220d1521745e9f4c'
      SITE: legacy\RegisterLivestock
      BUILT: ${{ github.workspace }}\build\legacy
      SCREENS_DIR: ${{ github.workspace }}\build\screens
      LEGACY_URL: http://localhost:8080/
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_WEBAPP_URL: ${{ vars.AZURE_WEBAPP_URL }}
      AZURE_READY: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' && vars.AZURE_WEBAPP_NAME != '' && vars.AZURE_WEBAPP_URL != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/demo/')) }}
      APP_DB_BUILT: ${{ github.workspace }}\build\app.db
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Note the start time
        run: '"JOB_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV'

      - uses: actions/checkout@v7

      - name: Fetch the SQLite library for .NET Framework
        run: |
          # Download the package straight from nuget.org and check it is the exact file expected.
          $id = 'stub.system.data.sqlite.core.netframework'
          $nupkg = "$env:RUNNER_TEMP\sqlite.zip"  # .zip, because Expand-Archive only accepts that extension
          $pkg = "$env:RUNNER_TEMP\sqlite"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/$id/$env:SQLITE_VERSION/$id.$env:SQLITE_VERSION.nupkg" -OutFile $nupkg -UseBasicParsing
          $hash = (Get-FileHash $nupkg -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256 $hash"
          if ($hash -ne $env:SQLITE_SHA256) { throw "Package fingerprint does not match: expected $env:SQLITE_SHA256" }
          Expand-Archive -Path $nupkg -DestinationPath $pkg -Force
          New-Item -ItemType Directory -Force "$env:SITE\Bin\x64", "$env:SITE\Bin\x86" | Out-Null
          Copy-Item "$pkg\lib\net46\System.Data.SQLite.dll" "$env:SITE\Bin\"
          Copy-Item "$pkg\build\net46\x64\SQLite.Interop.dll" "$env:SITE\Bin\x64\"
          Copy-Item "$pkg\build\net46\x86\SQLite.Interop.dll" "$env:SITE\Bin\x86\"
          Get-ChildItem -Recurse "$env:SITE\Bin" | Select-Object FullName, Length

      # The app runs on a copy of the pristine database with any migrations in db/migrations applied.
      - name: Make the app's database
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          node --no-warnings tools/apply-migrations.mjs "$env:APP_DB_BUILT"
          if ($LASTEXITCODE -ne 0) { throw "Applying migrations failed" }
          Copy-Item "$env:APP_DB_BUILT" "$env:SITE\App_Data\livestock.db"
          $migrations = @(Get-ChildItem db\migrations\*.sql -ErrorAction SilentlyContinue).Count
          "HAS_MIGRATIONS=$(if ($migrations -gt 0) { 'true' } else { 'false' })" >> $env:GITHUB_ENV

      - name: Check the joint keepers migration kept every keeper
        if: env.HAS_MIGRATIONS == 'true'
        run: |
          node --no-warnings tools/check-migration.mjs "$env:APP_DB_BUILT"
          if ($LASTEXITCODE -ne 0) { throw "The migration check failed" }

      - name: Compile the legacy app
        run: |
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\aspnet_compiler.exe"
          & $compiler -v / -p "$env:SITE" -u -f -errorstack "$env:BUILT"
          if ($LASTEXITCODE -ne 0) { throw "aspnet_compiler failed with exit code $LASTEXITCODE" }
          # Make sure the native SQLite files and the database are in the compiled output.
          New-Item -ItemType Directory -Force "$env:BUILT\Bin\x64", "$env:BUILT\Bin\x86", "$env:BUILT\App_Data" | Out-Null
          Copy-Item "$env:SITE\Bin\x64\SQLite.Interop.dll" "$env:BUILT\Bin\x64\" -Force
          Copy-Item "$env:SITE\Bin\x86\SQLite.Interop.dll" "$env:BUILT\Bin\x86\" -Force
          Copy-Item "$env:APP_DB_BUILT" "$env:BUILT\App_Data\livestock.db" -Force
          Get-ChildItem -Recurse "$env:BUILT" | Select-Object FullName, Length

      # IIS Express stops when the step that started it ends, so the app is started,
      # checked and diagnosed within this one step.
      - name: Run the legacy app in IIS Express and check it
        run: |
          $diag = "$env:RUNNER_TEMP\diag"
          New-Item -ItemType Directory -Force $diag | Out-Null
          $iis = @("$env:ProgramFiles\IIS Express\iisexpress.exe", "${env:ProgramFiles(x86)}\IIS Express\iisexpress.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iis) { throw "IIS Express not found" }
          Write-Host "Using $iis"
          $server = Start-Process -FilePath $iis -ArgumentList "/path:`"$env:BUILT`"", "/port:8080", "/systray:false" -RedirectStandardOutput "$diag\iisexpress.out.txt" -RedirectStandardError "$diag\iisexpress.err.txt" -PassThru
          $checkExit = 1
          try {
            $up = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $r = Invoke-WebRequest -Uri $env:LEGACY_URL -UseBasicParsing -TimeoutSec 10
                Write-Host "Status $($r.StatusCode)"
                $r.Content | Out-File "$diag\home.html"
                $up = $true; break
              } catch {
                Write-Host "Waiting: $($_.Exception.Message)"
                if ($_.ErrorDetails) { $_.ErrorDetails.Message | Out-File "$diag\home-error.html" }
                Start-Sleep -Seconds 2
              }
            }
            if (-not $up) { throw "The legacy app did not respond" }
            Push-Location tools/legacy-check
            npm ci --no-audit --no-fund
            $env:SCREENS_DIR = "$env:GITHUB_WORKSPACE\build\smoke"
            npm run check
            $checkExit = $LASTEXITCODE
            Pop-Location
            if ($checkExit -eq 0) {
              Push-Location golden
              npm ci --no-audit --no-fund
              $env:APP_URL = $env:LEGACY_URL
              $env:APP_DB = "$env:BUILT\App_Data\livestock.db"
              $env:PRISTINE_DB = $env:APP_DB_BUILT
              $env:SCREENS_DIR = "$env:GITHUB_WORKSPACE\build\screens"
              if ($env:HAS_MIGRATIONS -ne 'true') {
                # The legacy app as it stands: record the golden master.
                $env:MODE = 'record'
                node --no-warnings run.mjs
                $checkExit = $LASTEXITCODE
              } else {
                # The legacy app after the joint keepers change: the original scenarios must show
                # the same screens as the recorded golden master, apart from the animal page, which
                # the law changes on purpose and which must then match the approved new-law result;
                # then the law's own scenarios must match their approved results, screen by screen.
                $env:MODE = 'compare'
                $env:COMPARE = 'screen'
                $env:EXPECTED_CHANGES = 'S04'
                $env:EXPECTED_DIR = "$env:GITHUB_WORKSPACE\golden\results-new-law"
                $env:RESULTS_DIR = "$env:GITHUB_WORKSPACE\golden\results"
                node --no-warnings run.mjs
                $checkExit = $LASTEXITCODE
                $env:EXPECTED_CHANGES = ''
                $env:EXPECTED_DIR = ''
                $env:SCENARIOS = 'scenarios-joint-keepers.json'
                $env:RESULTS_DIR = "$env:GITHUB_WORKSPACE\golden\results-new-law"
                node --no-warnings run.mjs
                if ($LASTEXITCODE -ne 0) { $checkExit = $LASTEXITCODE }
              }
              Pop-Location
            }
          } finally {
            Copy-Item "$env:USERPROFILE\Documents\IISExpress\Logs" $diag -Recurse -ErrorAction SilentlyContinue
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }
          if ($checkExit -ne 0) { throw "The check failed" }

      - name: Prepare the app for Azure with a fresh database
        if: env.AZURE_READY == 'true'
        run: Copy-Item "$env:APP_DB_BUILT" "$env:BUILT\App_Data\livestock.db" -Force

      - name: Deploy the legacy app to Azure App Service
        if: env.AZURE_READY == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.BUILT }}
          clean: true
          restart: true

      - name: Check the hosted app
        if: env.AZURE_READY == 'true'
        run: |
          $deployed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          Write-Host "Job start to deployed: $($deployed - [int64]$env:JOB_START) seconds"
          Push-Location tools/legacy-check
          $env:HOSTED_URL = $env:AZURE_WEBAPP_URL
          $env:SCREENS_DIR = "$env:GITHUB_WORKSPACE\build\hosted"
          node hosted.mjs
          $exit = $LASTEXITCODE
          Pop-Location
          $done = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          Write-Host "Job start to hosted app checked: $($done - [int64]$env:JOB_START) seconds"
          if ($exit -ne 0) { throw "The hosted check failed" }

      - name: Upload hosted screenshots
        if: always() && env.AZURE_READY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: hosted-screens
          path: build/hosted
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-screens
          path: build/screens
          if-no-files-found: warn

      - name: Upload golden master results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-results
          path: golden/results/*.json
          if-no-files-found: warn

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-diagnostics
          path: ${{ runner.temp }}/diag
          if-no-files-found: ignore
