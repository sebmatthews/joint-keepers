# Phase 1: prove a GitHub Windows build machine can compile, run, test and
# screenshot the legacy VB.NET Web Forms app on SQLite.
name: Legacy app

on:
  push:
    paths:
      - 'legacy/**'
      - 'db/**'
      - 'tools/legacy-check/**'
      - '.github/workflows/legacy.yml'
  workflow_dispatch:

jobs:
  legacy:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      SQLITE_VERSION: '1.0.119'
      SQLITE_SHA256: 'f5f86b80729323890da590a8c7ba7957f04e2735e583d075220d1521745e9f4c'
      SITE: legacy\RegisterLivestock
      BUILT: ${{ github.workspace }}\build\legacy
      SCREENS_DIR: ${{ github.workspace }}\build\screens
      LEGACY_URL: http://localhost:8080/
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - name: Fetch the SQLite library for .NET Framework
        run: |
          # Download the package straight from nuget.org and check it is the exact file expected.
          $id = 'stub.system.data.sqlite.core.netframework'
          $nupkg = "$env:RUNNER_TEMP\sqlite.zip"  # .zip, because Expand-Archive only accepts that extension
          $pkg = "$env:RUNNER_TEMP\sqlite"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/$id/$env:SQLITE_VERSION/$id.$env:SQLITE_VERSION.nupkg" -OutFile $nupkg -UseBasicParsing
          $hash = (Get-FileHash $nupkg -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256 $hash"
          if ($hash -ne $env:SQLITE_SHA256) { throw "Package fingerprint does not match: expected $env:SQLITE_SHA256" }
          Expand-Archive -Path $nupkg -DestinationPath $pkg -Force
          New-Item -ItemType Directory -Force "$env:SITE\Bin\x64", "$env:SITE\Bin\x86" | Out-Null
          Copy-Item "$pkg\lib\net46\System.Data.SQLite.dll" "$env:SITE\Bin\"
          Copy-Item "$pkg\build\net46\x64\SQLite.Interop.dll" "$env:SITE\Bin\x64\"
          Copy-Item "$pkg\build\net46\x86\SQLite.Interop.dll" "$env:SITE\Bin\x86\"
          Get-ChildItem -Recurse "$env:SITE\Bin" | Select-Object FullName, Length

      - name: Copy the pristine database into the app
        run: Copy-Item db\livestock.db "$env:SITE\App_Data\livestock.db"

      - name: Compile the legacy app
        run: |
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\aspnet_compiler.exe"
          & $compiler -v / -p "$env:SITE" -u -f -errorstack "$env:BUILT"
          if ($LASTEXITCODE -ne 0) { throw "aspnet_compiler failed with exit code $LASTEXITCODE" }
          # Make sure the native SQLite files and the database are in the compiled output.
          New-Item -ItemType Directory -Force "$env:BUILT\Bin\x64", "$env:BUILT\Bin\x86", "$env:BUILT\App_Data" | Out-Null
          Copy-Item "$env:SITE\Bin\x64\SQLite.Interop.dll" "$env:BUILT\Bin\x64\" -Force
          Copy-Item "$env:SITE\Bin\x86\SQLite.Interop.dll" "$env:BUILT\Bin\x86\" -Force
          Copy-Item "$env:SITE\App_Data\livestock.db" "$env:BUILT\App_Data\" -Force
          Get-ChildItem -Recurse "$env:BUILT" | Select-Object FullName, Length

      # IIS Express stops when the step that started it ends, so the app is started,
      # checked and diagnosed within this one step.
      - name: Run the legacy app in IIS Express and check it
        run: |
          $diag = "$env:RUNNER_TEMP\diag"
          New-Item -ItemType Directory -Force $diag | Out-Null
          $iis = @("$env:ProgramFiles\IIS Express\iisexpress.exe", "${env:ProgramFiles(x86)}\IIS Express\iisexpress.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iis) { throw "IIS Express not found" }
          Write-Host "Using $iis"
          $server = Start-Process -FilePath $iis -ArgumentList "/path:`"$env:BUILT`"", "/port:8080", "/systray:false" -RedirectStandardOutput "$diag\iisexpress.out.txt" -RedirectStandardError "$diag\iisexpress.err.txt" -PassThru
          $checkExit = 1
          try {
            $up = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $r = Invoke-WebRequest -Uri $env:LEGACY_URL -UseBasicParsing -TimeoutSec 10
                Write-Host "Status $($r.StatusCode)"
                $r.Content | Out-File "$diag\home.html"
                $up = $true; break
              } catch {
                Write-Host "Waiting: $($_.Exception.Message)"
                if ($_.ErrorDetails) { $_.ErrorDetails.Message | Out-File "$diag\home-error.html" }
                Start-Sleep -Seconds 2
              }
            }
            if (-not $up) { throw "The legacy app did not respond" }
            Push-Location tools/legacy-check
            npm ci --no-audit --no-fund
            npm run check
            $checkExit = $LASTEXITCODE
            Pop-Location
          } finally {
            Copy-Item "$env:USERPROFILE\Documents\IISExpress\Logs" $diag -Recurse -ErrorAction SilentlyContinue
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }
          if ($checkExit -ne 0) { throw "The check failed" }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-screens
          path: build/screens
          if-no-files-found: warn

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-diagnostics
          path: ${{ runner.temp }}/diag
          if-no-files-found: ignore
